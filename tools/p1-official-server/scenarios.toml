# Lifecycle: 2 units, since a quantity can only be reduced and 1 must remain
# for the cancel; each price stays far below the market.
[[case]]
id = "lifecycle_stock_2890"
market = "stock"
code = "2890"
action = "Buy"
price_ref = "far_below"
price_type = "LMT"
order_type = "ROD"
quantity = 2
expect_fill = false
steps = ["place", "update_price:far_below_plus_tick", "update_qty:1", "cancel"]

[[case]]
id = "lifecycle_futures_tmf"
market = "futures"
code = "TMFJ6"
action = "Buy"
price_ref = "far_below"
price_type = "LMT"
order_type = "ROD"
quantity = 2
expect_fill = false
steps = ["place", "update_price:far_below_plus_tick", "update_qty:1", "cancel"]

