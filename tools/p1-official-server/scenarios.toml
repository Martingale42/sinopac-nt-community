# More lots than the largest stock funds figure pays for, at limit_down, for the
# insufficient-funds rejection; cancelled should the simulator accept it.
[[case]]
id = "exceed_funds_stock_2890"
market = "stock"
code = "2890"
action = "Buy"
price_ref = "limit_down"
price_type = "LMT"
order_type = "ROD"
quantity = "exceed_funds"
expect_fill = false
steps = ["place", "cancel"]

# custom_field round trips: 6 and 7 base62 characters spanning the character set's
# edges (Z, z, 9, a, A, 0), then the order tag candidate of 1 node character and a
# 5-character hash (docs/adr/0004-order-tag-reserves-node-id.md).
[[case]]
id = "custom_field_base62_6"
market = "stock"
code = "2890"
action = "Buy"
price_ref = "far_below"
price_type = "LMT"
order_type = "ROD"
quantity = 1
custom_field = "Zz9aA0"
expect_fill = false
steps = ["place", "cancel"]

[[case]]
