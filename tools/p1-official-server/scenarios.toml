# Order scenarios for `p1rec orders`, run in this order one case at a
# time, and the cases whose funds `p1rec preflight` checks. Every price is
# a reference to the contract's limits on the day, and a far_below price
# rests without filling.
#
# calibrate: TMFJ6 is the near-month TMF contract until it expires on
# 2026-10-21; roll it, here and in p1.toml, the day before a live run.

# Limit buys far below the market, never filled: a ROD rests until cancelled,
# an IOC or FOK expires at once.
[[case]]
id = "far_stock_2890_lmt_rod"
market = "stock"
code = "2890"
action = "Buy"
price_ref = "far_below"
price_type = "LMT"
order_type = "ROD"
quantity = 1
expect_fill = false
steps = ["place", "cancel"]

[[case]]
id = "far_stock_2890_lmt_ioc"
market = "stock"
code = "2890"
action = "Buy"
price_ref = "far_below"
price_type = "LMT"
order_type = "IOC"
quantity = 1
expect_fill = false
steps = ["place"]

[[case]]
id = "far_stock_2890_lmt_fok"
market = "stock"
code = "2890"
action = "Buy"
price_ref = "far_below"
price_type = "LMT"
order_type = "FOK"
quantity = 1
expect_fill = false
steps = ["place"]

[[case]]
id = "far_odd_00981a_lmt_rod"
market = "odd"
code = "00981A"
action = "Buy"
price_ref = "far_below"
price_type = "LMT"
order_type = "ROD"
quantity = 1
expect_fill = false
steps = ["place", "cancel"]

