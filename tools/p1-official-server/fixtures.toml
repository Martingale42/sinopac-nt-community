# Recorded lines `p1rec scrub` de-identifies and exports from results/p1/
# into test_data/official/1.7.6/ and lists in MANIFEST.toml there, one
# [[fixture]] table per exported file with these keys:
#
#   name        output file stem without path separators, suffixed by the
#               source type: rest.jsonl gives .json (the records as a JSON
#               array), sse_*.jsonl gives .sse (the frames' raw text), and
#               any other file gives .log (the lines themselves)
#   run_id      run directory under results/p1/
#   source      file in that run directory
#   lines       1-based line numbers in source, in output order
#   checklist   measurement checklist items the fixture is evidence for,
#               named as in docs/official-server-contract.md section 3
#   instrument  instrument code, or "" when none applies
#   recorded_at optional date-time with a UTC offset, required only when
#               the first selected line carries no timestamp of its own
#
# Server log lines that carry an IP address, the API key prefix or an
# account number are left out, so a log fixture can skip lines in between.

