# p1rec live configuration, holding no secrets, only the environment
# variable names that hold them, mapped in [secrets] and read by
# config.read_secrets.
#
# Relative paths (results_root, fixtures_root) resolve against the
# directory that holds this file.

base_url = "http://127.0.0.1:8080"

# Longer than the server's default SJ_HTTP_TIMEOUT (30s), so the client
# sees the server's own timeout response instead of timing out first.
http_timeout_s = 35

results_root = "../../results/p1"
fixtures_root = "../../test_data/official/1.7.6"

[secrets]
api_key = "SJ_API_KEY"
sec_key = "SJ_SEC_KEY"
ca_passwd = "SJ_CA_PASSWD"
person_id = "P1_PERSON_ID"
egress_ip = "P1_EGRESS_IP"

# Logical operation name -> method + path, from docs/official-server-contract.md
# section 1, excluding stream_connect, which has several SSE endpoints and
# is configured in a [stream] section instead of here.

[endpoints.mode]
method = "GET"
path = "/api/v1/info"

[endpoints.accounts]
method = "GET"
path = "/api/v1/auth/accounts"

[endpoints.contracts_stock]
method = "GET"
path = "/api/v1/data/contracts/{code}/info"

[endpoints.contracts_futures]
method = "GET"
path = "/api/v1/data/contracts/futures"

[endpoints.contracts_options]
method = "GET"
path = "/api/v1/data/contracts/options"

[endpoints.snapshots]
method = "POST"
path = "/api/v1/data/snapshots"

[endpoints.ticks]
method = "POST"
path = "/api/v1/data/ticks"

[endpoints.kbars]
method = "POST"
path = "/api/v1/data/kbars"

[endpoints.stream_subscribe]
method = "POST"
path = "/api/v1/stream/subscribe"

[endpoints.stream_unsubscribe]
method = "POST"
path = "/api/v1/stream/unsubscribe"

[endpoints.subscribe_trade]
method = "POST"
path = "/api/v1/auth/subscribe_trade"

[endpoints.place_stock]
method = "POST"
path = "/api/v1/order/place_order"

[endpoints.place_futures]
method = "POST"
path = "/api/v1/order/place_order"

[endpoints.update_price]
method = "POST"
path = "/api/v1/order/update_price"

[endpoints.update_qty]
method = "POST"
path = "/api/v1/order/update_qty"

[endpoints.cancel]
method = "POST"
path = "/api/v1/order/cancel_order"

[endpoints.trades]
method = "POST"
path = "/api/v1/order/trades"

[endpoints.positions]
method = "POST"
path = "/api/v1/portfolio/position_unit"

[endpoints.balance]
method = "POST"
path = "/api/v1/portfolio/account_balance"

[endpoints.margin]
method = "POST"
path = "/api/v1/portfolio/margin"

[endpoints.usage]
method = "GET"
path = "/api/v1/auth/usage"

[endpoints.ca_status]
method = "GET"
path = "/api/v1/auth/ca_expiretime"

[endpoints.harness_info]
method = "GET"
path = "/api/v1/agent/harness"

# Simulation-mode interlock (docs/official-server-contract.md section 1):
# mode's response has a top-level boolean at /simulation, true in
# simulation mode.
[interlock]
endpoint_op = "mode"
pointer = "/simulation"

# Order reports and stream timing, from the order_event and tick frames
# recorded in simulation mode on 2026-09-29. Report pointers are relative
# to the report an OrderEvent holds at data/<state>, since the state names
# that key.
[events]
order_event_name = "order_event"
order_states = ["StockOrder", "FuturesOrder"]
deal_states = ["StockDeal", "FuturesDeal"]
event_id = "/event_id"
order_key = "/order/id"
op_type = "/operation/op_type"
op_code = "/operation/op_code"
op_code_success = "00"

# The order's size comes from the order, since a Cancel's
# status.order_quantity reads 0.
order_qty = "/order/quantity"
cancel_qty = "/status/cancel_quantity"

# calibrate: no deal has been recorded yet, so these follow the OpenAPI
# StockDealEvent and FuturesDealEvent schemas until the first one is.
deal_key = "/trade_id"
deal_qty = "/quantity"
deal_exchange_ts = "/ts"

# Epoch seconds, which date an order for the trading-day window
order_exchange_ts = "/status/exchange_ts"

# trades answers with a bare array of Trade objects
rest_list = ""
rest_key = "/order/id"
rest_status = "/status/status"
rest_filled_qty = "/status/deal_quantity"

# calibrate: assumed to be epoch seconds like the events' exchange_ts,
# following the OpenAPI OrderStatusInfo schema until a trades response
# with orders is recorded.
rest_order_ts = "/status/order_ts"

# Tick frames carry the exchange time as Taipei-local date and time
# strings without a zone (docs/official-server-contract.md section 2).
exchange_ts_pointers = ["/date", "/time"]
exchange_ts_format = "%Y-%m-%d %H:%M:%S.%f"

heartbeat_event = "heartbeat"

# calibrate: twice the largest heartbeat interval stats measures on the
# first live day, and until then twice the 30 s heartbeat measured in
# docs/official-server-contract.md section 2.
gap_threshold_s = 60.0
