[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p1rec"
version = "0.1.0"
description = "Black-box recorder for the official shioaji server 1.7.6 (P1 spike)"
requires-python = ">=3.12"
authors = [{ name = "Martingale42", email = "wcmc9527@gmail.com" }]
dependencies = ["httpx>=0.27,<1"]

# Installed by `uv run`/`uv sync` by default so `uv run pytest` finds pytest.
[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
p1rec = "p1rec.cli:main"
p1watch = "p1rec.watch:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/p1rec"]
